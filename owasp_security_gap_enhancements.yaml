metadata:
  name: OWASP LLM Security Gap Enhancements
  version: '1.0'
  description: Targeted rules to address security gaps identified in comprehensive
    testing
  created: '2024-10-07'
  vulnerabilities_addressed:
  - LLM01
  - LLM02
  - LLM03
  - LLM05
  - LLM06
  - LLM07
  - LLM08
  - LLM10
  total_rules: 18
rules:
- id: OWASP-LLM01-MULTILANG-1.0
  pattern: (?i)(ignore|ignora|ignorez|ignorer|无视|忽略|無視|игнорировать).*(?:instruction|instrucción|instruction|指示|инструкция)
  action: block
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: Multi-language prompt injection bypass attempts
  severity: high
  mitre_attack: T1055.001
  owasp_category: LLM01
- id: OWASP-LLM01-UNICODE-2.0
  pattern: '[\u200B-\u200F\u2060-\u206F].*(?:ignore|bypass|override)'
  action: block
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: Unicode steganography in prompt injection
  severity: high
  mitre_attack: T1027.010
  owasp_category: LLM01
- id: OWASP-LLM01-CONTEXT-OVERFLOW-1.0
  pattern: (?i)(?:fill|stuff|flood|overflow).*(?:context|memory|buffer).*(?:ignore|bypass|override)
  action: block
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: Context window pollution for prompt injection
  severity: critical
  mitre_attack: T1499.004
  owasp_category: LLM01
- id: OWASP-LLM02-CMD-INJECTION-1.0
  pattern: (?i)(?:rm\s+-rf|del\s+/[sq]|format\s+[c-z]:).*(?:&&|\|\||;|`|\$\()
  action: block
  applies_to:
  - ai_output
  - generated_content
  endpoints:
  - /*
  description: Command injection in AI-generated output
  severity: critical
  mitre_attack: T1059.004
  owasp_category: LLM02
- id: OWASP-LLM02-SHELL-ESCAPE-1.0
  pattern: (?:bash|sh|cmd|powershell|pwsh)\s+-c\s+.*(?:system|exec|eval)
  action: block
  applies_to:
  - ai_output
  - generated_content
  endpoints:
  - /*
  description: Shell escape sequences in output
  severity: high
  mitre_attack: T1059.004
  owasp_category: LLM02
- id: OWASP-LLM03-CONTEXT-POISON-1.0
  pattern: (?i)(?:stuff|pollute|contaminate|corrupt).*(?:context|memory|training).*(?:mislead|bias|manipulate)
  action: block
  applies_to:
  - user_input
  - training_data
  endpoints:
  - /*
  description: Context pollution for training manipulation
  severity: high
  mitre_attack: T1565.001
  owasp_category: LLM03
- id: OWASP-LLM03-ADVERSARIAL-DATA-1.0
  pattern: (?i)(?:adversarial|poisoned|corrupted).*(?:example|sample|data).*(?:inject|embed|hide)
  action: block
  applies_to:
  - training_data
  - user_input
  endpoints:
  - /*
  description: Adversarial data injection attempts
  severity: critical
  mitre_attack: T1565.003
  owasp_category: LLM03
- id: OWASP-LLM05-TYPOSQUAT-1.0
  pattern: (?i)(?:install|download|import).*(?:typo|fake|malicious|compromised).*(?:package|library|dependency)
  action: block
  applies_to:
  - user_input
  - system_commands
  endpoints:
  - /*
  description: Typosquatting dependency confusion attacks
  severity: high
  mitre_attack: T1195.001
  owasp_category: LLM05
- id: OWASP-LLM05-PKG-CONFUSION-1.0
  pattern: (?i)(?:npm|pip|gem|cargo)\s+(?:install|add).*(?:--force|--unsafe|--insecure)
  action: flag
  applies_to:
  - system_commands
  - user_input
  endpoints:
  - /*
  description: Unsafe package manager operations
  severity: medium
  mitre_attack: T1195.002
  owasp_category: LLM05
- id: OWASP-LLM06-TRAINING-EXTRACT-1.0
  pattern: (?i)(?:extract|retrieve|show|reveal).*(?:training|personal).*(?:data|information).*(?:about|regarding|for)\s+[A-Z][a-z]+\s+[A-Z][a-z]+
  action: block
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: Training data extraction attempts with person names
  severity: critical
  mitre_attack: T1552.001
  owasp_category: LLM06
- id: OWASP-LLM06-SYSTEM-DETAILS-1.0
  pattern: (?i)(?:reveal|show|describe).*(?:system|architecture|internal|configuration).*(?:detail|structure|design)
  action: flag
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: Internal system details disclosure attempts
  severity: medium
  mitre_attack: T1082
  owasp_category: LLM06
- id: OWASP-LLM06-PII-PATTERN-1.0
  pattern: (?i)(?:my|our)\s+(?:employee\s+id|social\s+security|credit\s+card).*(?:give|provide|grant).*(?:access|permission)
  action: block
  applies_to:
  - user_input
  - prompt
  endpoints:
  - /*
  description: PII-based unauthorized access attempts
  severity: high
  mitre_attack: T1552.004
  owasp_category: LLM06
- id: OWASP-LLM07-PRIVILEGE-ESC-1.0
  pattern: (?i)(?:escalate|elevate|increase).*(?:privilege|permission|access).*(?:through|via|using).*plugin
  action: block
  applies_to:
  - user_input
  - plugin_commands
  endpoints:
  - /*
  description: Plugin privilege escalation attempts
  severity: critical
  mitre_attack: T1548
  owasp_category: LLM07
- id: OWASP-LLM07-SANDBOX-ESCAPE-1.0
  pattern: (?i)(?:break|escape|bypass).*(?:sandbox|container|isolation).*(?:access|execute|run).*(?:host|system)
  action: block
  applies_to:
  - plugin_commands
  - user_input
  endpoints:
  - /*
  description: Plugin sandbox escape attempts
  severity: critical
  mitre_attack: T1611
  owasp_category: LLM07
- id: OWASP-LLM08-PERM-GRANT-1.0
  pattern: (?i)(?:grant|give|provide).*(?:full|complete|total|unlimited).*(?:administrative|admin|root|sudo).*(?:access|permission|privilege)
  action: flag
  applies_to:
  - user_input
  - system_commands
  endpoints:
  - /*
  description: Excessive permission grants
  severity: high
  mitre_attack: T1548.003
  owasp_category: LLM08
- id: OWASP-LLM08-AUTHORITY-DELEGATE-1.0
  pattern: (?i)(?:delegate|transfer|assign).*(?:administrative|management|control).*(?:authority|power).*(?:autonomous|agent|ai)
  action: flag
  applies_to:
  - user_input
  - policy_changes
  endpoints:
  - /*
  description: Authority delegation to autonomous systems
  severity: medium
  mitre_attack: T1098
  owasp_category: LLM08
- id: OWASP-LLM10-DATA-EXTRACT-2.0
  pattern: (?i)(?:extract|retrieve|dump|export).*(?:original|source|raw).*(?:training|dataset).*(?:from|via).*(?:model|response)
  action: block
  applies_to:
  - user_input
  - api_queries
  endpoints:
  - /*
  description: Enhanced training data extraction prevention
  severity: critical
  mitre_attack: T1552.001
  owasp_category: LLM10
- id: OWASP-LLM10-PATTERN-ANALYSIS-1.0
  pattern: (?i)(?:analyze|study|examine).*(?:response|output).*(?:pattern|structure|format).*(?:reverse|extract|infer).*(?:model|architecture)
  action: flag
  applies_to:
  - user_input
  - analytical_queries
  endpoints:
  - /*
  description: Model architecture analysis via response patterns
  severity: medium
  mitre_attack: T1574.012
  owasp_category: LLM10
