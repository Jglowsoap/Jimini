<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Jimini AI Security Operations Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.2em; opacity: 0.9; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-card h3 { font-size: 0.9em; opacity: 0.8; margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #4ade80; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .dashboard-section {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .section-title { 
            font-size: 1.4em; 
            margin-bottom: 20px; 
            color: #4ade80; 
            border-bottom: 2px solid #4ade80;
            padding-bottom: 10px;
        }
        .owasp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .effectiveness {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .high { background: #22c55e; }
        .medium { background: #f59e0b; }
        .low { background: #ef4444; }
        .test-section {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }
        .test-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .test-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1em;
        }
        .test-input::placeholder { color: rgba(255,255,255,0.7); }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4ade80;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { background: #22c55e; transform: translateY(-2px); }
        .attack-log {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
        }
        .attack-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .blocked { background: rgba(34, 197, 94, 0.3); }
        .flagged { background: rgba(245, 158, 11, 0.3); }
        .allowed { background: rgba(239, 68, 68, 0.3); }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .online { background: #22c55e; }
        .offline { background: #ef4444; }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Dashboard HTML content here -->
    <div class="container">
        <div class="header">
            <h1>🛡️ Jimini AI Security Operations Center</h1>
            <p>Enhanced OWASP LLM Top 10 Security • Real-time Monitoring</p>
            <p>Current Status: <span id="status-text">Initializing...</span></p>
        </div>
    </div>
</body>
</html>
