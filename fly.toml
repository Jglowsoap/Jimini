# Fly.io configuration for Jimini deployment
app = "jimini-demo"
primary_region = "iad"

[build]

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[env]
  JIMINI_SHADOW = "1"
  JIMINI_RULES_PATH = "/app/policy_rules.yaml"

[mounts]
  source = "jimini_logs"
  destination = "/app/logs"
